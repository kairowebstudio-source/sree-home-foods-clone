name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin login to use server auth proxy
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("src/routes/admin.index.tsx")
          text = path.read_text(encoding="utf-8")
          marker = "// Server-side auth proxy: avoids direct browser Auth requests."
          if marker not in text:
              old = '''  // Login handler — uses Supabase Auth email/password
  const handleLogin = async (e: React.FormEvent) => {
    e.preventDefault();
    setLoggingIn(true);
    setLoginError("");
    try {
      const sb = await loadSupabase();
      if (!sb) {
        setLoginError("Supabase is not configured. Check environment variables.");
        return;
      }
      const { error } = await sb.auth.signInWithPassword({
        email: email.trim().toLowerCase(),
        password,
      });
      if (error) {
        setLoginError(error.message || "Invalid email or password. Try again.");
        return;
      }
      // Verify the signed-in email is in the allowed list
      const user = (await sb.auth.getUser()).data.user;
      if (!user || !ALLOWED_ADMIN_EMAILS.has((user.email ?? "").toLowerCase())) {
        await sb.auth.signOut();
        setLoginError("Access denied. This email is not authorized for admin access.");
        return;
      }
      setAuthed(true);
    } catch (err) {
      console.error("Admin login error:", err);
      setLoginError(err instanceof Error ? err.message : "Something went wrong. Try again.");
    } finally {
      setLoggingIn(false);
    }
  };
'''
              new = '''  // Server-side auth proxy: avoids direct browser Auth requests.
  const handleLogin = async (e: React.FormEvent) => {
    e.preventDefault();
    setLoggingIn(true);
    setLoginError("");
    try {
      const normalizedEmail = email.trim().toLowerCase();
      if (!ALLOWED_ADMIN_EMAILS.has(normalizedEmail)) {
        setLoginError("Access denied. This email is not authorized for admin access.");
        return;
      }

      const response = await fetch("/api/admin-auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: normalizedEmail, password }),
      });

      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        setLoginError(payload?.error || `Login failed (${response.status}). Please try again.`);
        return;
      }

      const session = payload?.session;
      if (!session?.access_token || !session?.refresh_token || !session?.user) {
        setLoginError("Login succeeded but no valid session was returned. Please try again.");
        return;
      }

      const sb = await loadSupabase();
      if (!sb) {
        setLoginError("Supabase client is not configured in this deployment.");
        return;
      }
      const { error: sessionError } = await sb.auth.setSession({
        access_token: session.access_token,
        refresh_token: session.refresh_token,
      });
      if (sessionError) {
        setLoginError(sessionError.message || "Could not establish the admin session.");
        return;
      }

      const signedInEmail = (session.user.email ?? "").toLowerCase();
      if (!ALLOWED_ADMIN_EMAILS.has(signedInEmail)) {
        await sb.auth.signOut();
        setLoginError("Access denied. This email is not authorized for admin access.");
        return;
      }
      setAuthed(true);
    } catch (err) {
      console.error("Admin login error:", err);
      setLoginError(err instanceof Error ? err.message : "Unable to reach the login service. Try again.");
    } finally {
      setLoggingIn(false);
    }
  };
'''
              if old not in text:
                  raise SystemExit("Expected admin login handler not found")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", str(path)], check=True)
              subprocess.run(["git", "commit", "-m", "Fix admin login auth flow"], check=True)
              subprocess.run(["git", "push"], check=True)
          else:
              print("Admin login proxy already applied")

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
